# Configuração Nginx - Agente Financeiro
# Domínios: erp.innovtecno.com.br e backerp.innovtecno.com.br
# Arquivo temporário usado pelo Certbot antes de gerar os certificados SSL

server {
    listen 80;
    server_name erp.innovtecno.com.br backerp.innovtecno.com.br;

    # Rota para validação do Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona tudo para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
