# Configuração Nginx com SSL - Agente Financeiro
# Domínios: erp.innovtecno.com.br e backerp.innovtecno.com.br

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name erp.innovtecno.com.br backerp.innovtecno.com.br;

    # Rota para renovação automática do Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# erp.innovtecno.com.br — HTTPS
server {
    listen 443 ssl;
    server_name erp.innovtecno.com.br;

    ssl_certificate     /etc/letsencrypt/live/erp.innovtecno.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.innovtecno.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Proxy para o Streamlit
    location / {
        proxy_pass         http://app:8501;
        proxy_http_version 1.1;

        # Suporte a WebSocket (necessário para Streamlit)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}

# backerp.innovtecno.com.br — HTTPS (aponta para o mesmo Streamlit)
server {
