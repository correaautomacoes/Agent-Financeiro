version: '3.8'

volumes:
  app-data:
  certbot-conf:
  certbot-www:

networks:
  agent_net:

services:
  # Aplicação Streamlit
  app:
    build:
      context: .
      dockerfile: Dockerfile.sqlite
    container_name: agente_financeiro
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    networks:
      - agent_net
    restart: always
    # NÃO expõe porta diretamente ao mundo — passa pelo Nginx
    expose:
      - "8501"

  # Nginx (Reverse Proxy + SSL Termination)
  nginx:
    image: nginx:alpine
    container_name: agente_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - agent_net
    depends_on:
      - app
    restart: always

  # Certbot (renovação automática SSL)
  certbot:
    image: certbot/certbot
    container_name: agente_certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renova automaticamente a cada 12h
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    restart: always
